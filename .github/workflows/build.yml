name: Build iOS app

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "LocalAI/**"
      - "project.yml"
      - ".github/workflows/build.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - name: Check out app source
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          XCODE_PATH=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -n 1)
          if [ -n "$XCODE_PATH" ]; then sudo xcode-select -s "$XCODE_PATH/Contents/Developer"; fi
          xcodebuild -version
          cmake --version

      - name: Install build tools
        run: brew install cmake xcodegen

      - name: Build llama.cpp iOS framework
        run: |
          git clone --depth 1 https://github.com/ggml-org/llama.cpp.git third_party/llama.cpp
          cd third_party/llama.cpp
          ./build-xcframework.sh ios-device
          test -d build-apple/llama.xcframework
          cd "$GITHUB_WORKSPACE"
          mkdir -p Frameworks
          cp -R third_party/llama.cpp/build-apple/llama.xcframework Frameworks/

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build unsigned iOS app
        run: |
          set -o pipefail
          xcodebuild \
            -project LocalAI.xcodeproj \
            -scheme LocalAI \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build | tee build.log

      - name: Package unsigned IPA
        run: |
          APP_PATH="build/DerivedData/Build/Products/Release-iphoneos/LocalAI.app"
          test -d "$APP_PATH"
          mkdir -p build/ipa/Payload
          cp -R "$APP_PATH" build/ipa/Payload/
          cd build/ipa
          zip -qr "$GITHUB_WORKSPACE/ST-Local-AI-unsigned.ipa" Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ST-Local-AI-unsigned-IPA
          path: ST-Local-AI-unsigned.ipa
          if-no-files-found: error

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore
